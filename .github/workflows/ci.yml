name: CI

on:
  push:
  pull_request:

jobs:
  helper:
    # `SWTFU-Helper verify` needs the decoded game image, which is not in the
    # repository; run it locally after changing helper/tfu1.h or tfu2.h.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SWTFU-Helper (x86 Release)
        run: |
          cmake -S helper -B helper/build -A Win32
          cmake --build helper/build --config Release

      - name: Selftest
        run: .\SWTFU-Helper.exe selftest

      - uses: actions/upload-artifact@v4
        with:
          name: SWTFU-Helper
          path: SWTFU-Helper.exe
